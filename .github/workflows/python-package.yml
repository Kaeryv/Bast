# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

env:
  MPLBACKEND: Agg

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.10", "3.12"]

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install ".[dev]"
        python -m pip check
    - name: Build wheel and source distribution
      run: python -m build
    - name: Smoke-test built wheel
      run: |
        python -m pip install --force-reinstall --no-deps dist/*.whl
        cd /tmp
        python -c "import khepri, khepri.tmat.scattering, khepri.validation; print(khepri.__file__)"
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 khepri test scripts examples --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 khepri test scripts examples --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics -qq
    - name: Test with unittest
      run: |
        python -m unittest discover test

  uv-install:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - uses: astral-sh/setup-uv@v9
    - name: Build and install source distribution with uv
      run: |
        uv build
        uv venv /tmp/khepri-uv-smoke
        uv pip install --python /tmp/khepri-uv-smoke/bin/python dist/*.tar.gz
        cd /tmp
        /tmp/khepri-uv-smoke/bin/python -c "import khepri, khepri.tmat.scattering, khepri.validation; print(khepri.__file__)"
