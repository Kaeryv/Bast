name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.10", "3.12", "3.14"]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: ${{ matrix.python-version }}

      - name: Install project and development tools
        run: |
          uv venv --python "${{ matrix.python-version }}"
          uv pip install --python .venv/bin/python ".[dev]"
          uv pip check --python .venv/bin/python

      - name: Check for syntax errors and undefined names
        if: matrix.python-version == '3.14'
        run: >-
          .venv/bin/flake8 khepri test scripts examples
          --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Report style debt
        if: matrix.python-version == '3.14'
        run: >-
          .venv/bin/flake8 khepri test scripts examples
          --count --exit-zero --max-complexity=10 --max-line-length=127
          --statistics -qq

      - name: Run test suite
        run: .venv/bin/python -m unittest discover test

  distribution:
    name: Build and smoke-test distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.12"

      - name: Build wheel and source distribution
        run: uv build --no-sources

      - name: Smoke-test wheel with uv
        run: |
          cd /tmp
          uv run --python 3.12 --isolated --no-project \
            --with "$GITHUB_WORKSPACE"/dist/*.whl \
            "$GITHUB_WORKSPACE"/test/package_smoke.py

      - name: Smoke-test source distribution with uv
        run: |
          cd /tmp
          uv run --python 3.12 --isolated --no-project \
            --with "$GITHUB_WORKSPACE"/dist/*.tar.gz \
            "$GITHUB_WORKSPACE"/test/package_smoke.py

      - name: Smoke-test wheel with pip
        run: |
          uv venv --seed /tmp/khepri-pip-smoke --python 3.12
          /tmp/khepri-pip-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/khepri-pip-smoke/bin/python \
            "$GITHUB_WORKSPACE/test/package_smoke.py"

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: khepri-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7
